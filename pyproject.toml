[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lrgp"
version = "0.4.0"
description = "Lightweight Reticulum Gaming Protocol — multiplayer games over LXMF mesh networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
rns = ["rns>=1.0", "lxmf>=0.9"]
chess = ["chess>=1.10"]
dev = ["pytest", "pytest-cov", "chess>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve the in-repo package ahead of any installed copy so the suite
# always tests this checkout.
pythonpath = ["src"]
